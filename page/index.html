<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WorkBuddy Sync</title>
  <link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script>
  <script src="data.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="brand-mark" src="icon.svg" alt="">
      <div class="brand-copy">
        <h1>WorkBuddy Sync</h1>
        <p class="muted">主机负责刷新，从机只读使用同一组 WorkBuddy / WorkBuddy AI 账号。</p>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" id="sync-now" class="primary">立即同步</button>
      <button type="button" id="reload" class="quiet">刷新状态</button>
      <button type="button" id="copy-diagnostics" class="quiet">复制诊断</button>
    </div>
  </header>

  <main id="content">
    <p class="muted">正在读取状态……</p>
  </main>

  <footer class="foot muted">WorkBuddy Sync · 通过 Magpie 的 GitHub 同步传递账号，不额外配置 token 或口令</footer>
</body>
</html>
